name: Tests

on: [push]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Enable corepack
        run: corepack enable

      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version: 26.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile --mode=skip-build

      - name: Unit Tests
        run: yarn test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Enable corepack
        run: corepack enable

      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version: 26.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile --mode=skip-build

      - name: Build
        run: yarn build

      - name: E2E Tests
        run: |
          yarn start &
          # Give the app up to 60 seconds to become available before running Cypress.
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:3000; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://localhost:3000
          # Install the Cypress binary through the lockfile-pinned local CLI, without npx.
          ./node_modules/.bin/cypress install
          yarn cy:run

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
