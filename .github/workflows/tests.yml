name: Tests

on: [push]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Enable corepack
        run: corepack enable

      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version: 26.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile --mode=skip-build

      - name: Unit Tests
        run: yarn test:coverage

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=danieljxavier
            -Dsonar.projectKey=DanielJXavier_my-portfolio

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Enable corepack
        run: corepack enable

      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version: 26.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile --mode=skip-build

      - name: Build
        run: yarn build

      - name: E2E Tests
        run: |
          yarn start &
          # Give the app up to 60 seconds to become available before running Cypress.
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://localhost:3000; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://localhost:3000
          # Install the Cypress binary through the lockfile-pinned local CLI, without npx.
          ./node_modules/.bin/cypress install
          yarn cy:run

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
